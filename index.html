<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FULL Salsing - Tech News with a Spicy Flavour</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="alternate" type="application/rss+xml" title="FULL Salsing RSS" href="feed.xml">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <img src="fullsalsing.png" alt="FULL Salsing - Tech News with a Spicy Flavour" class="header-banner">
        </header>

        <!-- Sticky band: carousel + top pager -->
        <div class="sticky-band" id="sticky-band">
            <div class="carousel-container">
                <div class="carousel-track">
                    <div class="carousel-item" id="carousel-text-a"></div>
                    <div class="carousel-item carousel-item--hidden" id="carousel-text-b"></div>
                </div>
                <img src="fullsalsing.png" alt="" aria-hidden="true" class="sticky-logo">
            </div>
            <div class="sticky-pager-wrap">
                <nav id="pagination-top" class="pagination pagination--compact" aria-label="News pagination (top)"></nav>
            </div>
        </div>

        <!-- Main Content Grid -->
        <main class="content-grid">
            <section id="blocks-container"></section>
        </main>

        <!-- Bottom Pagination -->
        <nav id="pagination" class="pagination" aria-label="News pagination"></nav>

        <!-- Footer -->
        <footer class="footer">
            <p>FULL Salsing &copy; 2026 | Where Tech Gets Spicy 🌶️ | <a href="feed.xml" class="footer-link">RSS</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
