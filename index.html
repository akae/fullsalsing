<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FULL Salsing - Tech News with a Spicy Flavour</title>
    <link rel="stylesheet" href="styles.css?v=20261124p">
    <link rel="alternate" type="application/rss+xml" title="FULL Salsing RSS" href="feed.xml">
    <script src="matrix.js?v=20261124g" defer></script>
    <script src="game-loader.js?v=20261124y" defer></script>
    <script src="wind.js?v=20261125b" defer></script>
    <script src="mobile-eggs.js?v=20261125a" defer></script>
</head>
<body>
    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <a href="./" class="header-link" aria-label="FULL Salsing home">
                <img src="fullsalsing.png" alt="FULL Salsing - Tech News with a Spicy Flavour" class="header-banner">
            </a>
        </header>

        <!-- Sticky band: carousel + top pager -->
        <div class="sticky-band" id="sticky-band">
            <div class="carousel-container">
                <div class="carousel-track">
                    <div class="carousel-item" id="carousel-text-a"></div>
                    <div class="carousel-item carousel-item--hidden" id="carousel-text-b"></div>
                </div>
                <a href="./" class="sticky-logo" aria-label="FULL Salsing home"></a>
            </div>
            <div class="sticky-pager-wrap">
                <nav id="pagination-top" class="pagination pagination--compact" aria-label="News pagination (top)"></nav>
            </div>
        </div>

        <!-- Main Content Grid -->
        <main class="content-grid">
            <section id="blocks-container"></section>
        </main>

        <!-- Bottom Pagination -->
        <nav id="pagination" class="pagination" aria-label="News pagination"></nav>

        <!-- Footer -->
        <footer class="footer">
            <p>FULL Salsing &copy; 2026 | Where Tech Gets Spicy 🌶️ | <a href="feed.xml" class="footer-link">RSS</a></p>
        </footer>
    </div>

    <script src="script.js?v=20261124f"></script>
    <nav class="mobile-eggs" aria-label="Easter eggs">
        <button type="button" class="egg-btn" data-egg="matrix" aria-label="Toggle the ASCII matrix logo" title="ASCII matrix logo">
            <span class="egg-icon" aria-hidden="true">▦</span>
            <span class="egg-label">ASCII</span>
        </button>
        <button type="button" class="egg-btn" data-egg="game" aria-label="Play Salsing Breaker" title="Play Salsing Breaker">
            <span class="egg-icon" aria-hidden="true">🎮</span>
            <span class="egg-label">GAME</span>
        </button>
        <button type="button" class="egg-btn" data-egg="wind" aria-label="Blow the salsings away" title="Blow the salsings away">
            <span class="egg-icon" aria-hidden="true">🌬️</span>
            <span class="egg-label">WIND</span>
        </button>
    </nav>
</body>
</html>
