name: Generate Salsings

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of salsings to generate
        required: false
        default: "4"
        type: string
      dry_run:
        description: Print salsings without committing
        required: false
        default: false
        type: boolean
  schedule:
    # Daily at 09:00 UTC: 2 salsings picked from the top-voted / most important stories
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: autosalsing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate salsings
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_TOKEN }}
          # Scheduled runs have no inputs, so they default to 2 salsings.
          SALSING_COUNT: ${{ inputs.count || '2' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python scripts/generate_salsings.py

      - name: Commit and push
        if: ${{ steps.generate.outputs.topics != '' && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          git commit -m "Add salsings: ${{ steps.generate.outputs.topics }}"
          git push origin HEAD:main
