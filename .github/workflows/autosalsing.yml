name: Generate Salsings

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of salsings to generate
        required: false
        default: "5"
        type: string
      dry_run:
        description: Print salsings without committing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: autosalsing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate salsings
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_TOKEN }}
          SALSING_COUNT: ${{ inputs.count }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/generate_salsings.py

      - name: Commit and push
        if: ${{ inputs.dry_run == false && steps.generate.outputs.topics != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          git commit -m "Add salsings: ${{ steps.generate.outputs.topics }}"
          git push origin HEAD:main
