name: Salsing From Input

on:
  workflow_dispatch:
    inputs:
      input:
        description: Link (URL) or topic to turn into a full-width salsing
        required: true
        type: string
      dry_run:
        description: Print the salsing without committing
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: autosalsing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate salsing
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.CLAUDE_API_TOKEN }}
          SALSING_INPUT: ${{ inputs.input }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/generate_one_salsing.py

      - name: Commit and push
        if: ${{ inputs.dry_run == false && steps.generate.outputs.topic != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          git commit -m "Add salsing: ${{ steps.generate.outputs.topic }}"
          git push origin HEAD:main
